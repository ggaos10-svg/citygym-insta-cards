name: publish

# Renders new card posts with Remotion (remotion/, Note design) and publishes approved ones
# whose time has passed. Runs hourly at :23 (UTC), and on pushes to drafts or the renderer.
on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths: ["data/posts/**", "remotion/**", "cards/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be published"
        type: boolean
        default: false

concurrency:
  group: cards-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Most hourly runs have nothing new; only then install Node, Remotion and Korean fonts.
      - name: Find posts to render
        id: todo
        run: echo "ids=$(python -m cards render-due --pending | xargs)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.todo.outputs.ids != ''
        with:
          node-version: "20"

      - name: Install renderer
        if: steps.todo.outputs.ids != ''
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --prefix remotion --no-audit --no-fund

      - name: Render new posts
        if: steps.todo.outputs.ids != ''
        run: python -m cards render-due

      # Videos must be on GitHub before Instagram can fetch them (via jsDelivr).
      - name: Push videos
        run: |
          git config user.name "cards-bot"
          git config user.email "cards-bot@users.noreply.github.com"
          git add media
          if ! git diff --cached --quiet; then
            git commit -m "bot: render $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
            sleep 20
          fi

      - name: Publish
        if: github.event_name != 'push'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_TOKEN_OUT: ${{ runner.temp }}/new_token
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m cards whoami
            python -m cards publish-due --dry-run
          else
            python -m cards publish-due
            python -m cards refresh-token
          fi

      - name: Store refreshed token
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "$RUNNER_TEMP/new_token" ]; then
            gh secret set INSTAGRAM_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/new_token"
            rm -f "$RUNNER_TEMP/new_token"
            echo "token secret updated"
          fi

      - name: Commit data
        run: |
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: publish run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
